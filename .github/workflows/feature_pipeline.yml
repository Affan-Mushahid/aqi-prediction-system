name: Feature pipeline

on:
  schedule:
    # Run at the 17 minutes mark every hour
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: feature-pipeline
  cancel-in-progress: false

jobs:
  run-feature-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f src/pipelines/feature_requirements.txt ]; then pip install -r src/pipelines/feature_requirements.txt; fi

      - name: Run feature pipeline
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          python -u src/pipelines/feature_pipeline.py